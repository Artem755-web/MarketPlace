version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: marketplace-db
    environment:
      POSTGRES_DB: MarketPlace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passwordSecret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MarketPlace"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: marketplace-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/MarketPlace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: passwordSecret